name: Generate Snake and 3D City
on:
  schedule:
    - cron: "0 0 * * *" # Her gece çalışır
  workflow_dispatch:      # Manuel tetikleme butonu
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 3D Şehir Oluşturucu
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # 2. Yılan (Snake) Oluşturucu (Dark Mode)
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snake/github-snake-dark.svg?palette=github-dark

      # 3. Dosyaları Repoya Kaydet
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Yilan ve 3D Sehir guncellendi 🐍🏙️" || echo "Degisiklik yok"
          git push
